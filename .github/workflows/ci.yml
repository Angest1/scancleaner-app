name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint (Biome)
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests (Vitest)
        run: pnpm test

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit and sandbox integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: pnpm build

      - name: Check release compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --release

  benchmark:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run synthetic CI benchmark & UI compositor audit
        shell: pwsh
        run: |
          $raw = cargo run --release --manifest-path src-tauri/Cargo.toml --bin scancleaner-bench -- --ci
          $raw | Out-File -FilePath bench-ci-result.json -Encoding utf8
          $json = $raw | ConvertFrom-Json
          $ui = pnpm bench:ui | Out-String

          $summary = @(
            "## ScanCleaner Synthetic Benchmark (CI)"
            ""
            "| Metric | Result |"
            "|---|---|"
            "| Synthetic Cold Scan (15k files) | $($json.coldTtiMs) ms |"
            "| Warm Snapshot Load (mmap + LZ4) | $($json.warmTtiMs) ms |"
            "| Incremental USN 500-event delta | $($json.incrementalUsn500EventsMs) ms |"
            "| MFT Parser Throughput (50k records) | $([math]::Round($json.mftParserRecordsPerSec)) rec/s ($($json.mftParser200kRecordsMs) ms) |"
            "| Cleaner View Open (precomputed) | $($json.cleanerOpenMs) ms |"
            "| Dev Cleaner View Open (warm cache) | $($json.devCleanerOpenMs) ms |"
            "| Fast Delete 10k files (perceived / total) | $($json.delete50kPerceivedMs) ms / $($json.delete50kTotalMs) ms |"
            "| Subtree Reconciliation (5k files) | $($json.reconcileSubtreeMs) ms |"
            "| Peak Working Set | $([math]::Round($json.peakMemoryMb, 1)) MB |"
            ""
            "### UI Animation Compositor Audit"
            '```text'
            $ui.Trim()
            '```'
          ) -join "`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
